[workspace]
# Use git tags for version detection (not published to crates.io).
# Implies `cargo publish` is skipped.
git_only = true
# Tag format
git_tag_name = "v{{ version }}"
# Use conventional commits to determine version bumps and generate changelog
changelog_update = true
# Only open release PRs for changes that affect the shipped binary
release_commits = "^(feat|fix|refactor|perf)[(:!]"
# Only release when a release PR (branch prefix `release-plz-`) is merged
release_always = false

[changelog]
# release-plz's default parsers, with ci and test commits left out of the changelog.
commit_parsers = [
    { message = "^(ci|test)[(:!]", skip = true },
    { message = "^feat", group = "added" },
    { message = "^changed", group = "changed" },
    { message = "^deprecated", group = "deprecated" },
    { message = "^fix", group = "fixed" },
    { message = "^security", group = "security" },
    { message = "^.*", group = "other" },
]

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "target/$TARGET/release"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "../../../arbor-$TARGET.zip" arbor.exe
          else
            tar czf "../../../arbor-$TARGET.tar.gz" arbor
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: arbor-${{ matrix.target }}
          path: |
            arbor-${{ matrix.target }}.tar.gz
            arbor-${{ matrix.target }}.zip

  upload:
    name: Upload assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" arbor-*.tar.gz arbor-*.zip --clobber

  homebrew:
    name: Update Homebrew tap
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: morellodev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"

          DARWIN_ARM64_SHA=$(sha256sum arbor-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          DARWIN_X86_SHA=$(sha256sum arbor-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          LINUX_X86_SHA=$(sha256sum arbor-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          LINUX_ARM64_SHA=$(sha256sum arbor-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)

          DARWIN_ARM64_URL="https://github.com/morellodev/arbor/releases/download/v${VERSION}/arbor-aarch64-apple-darwin.tar.gz"
          DARWIN_X86_URL="https://github.com/morellodev/arbor/releases/download/v${VERSION}/arbor-x86_64-apple-darwin.tar.gz"
          LINUX_X86_URL="https://github.com/morellodev/arbor/releases/download/v${VERSION}/arbor-x86_64-unknown-linux-gnu.tar.gz"
          LINUX_ARM64_URL="https://github.com/morellodev/arbor/releases/download/v${VERSION}/arbor-aarch64-unknown-linux-gnu.tar.gz"

          mkdir -p Formula
          cat > Formula/arbor.rb << FORMULA
          class Arbor < Formula
            desc "A CLI for managing git worktrees"
            homepage "https://github.com/morellodev/arbor"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${DARWIN_ARM64_URL}"
                sha256 "${DARWIN_ARM64_SHA}"
              else
                url "${DARWIN_X86_URL}"
                sha256 "${DARWIN_X86_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${LINUX_ARM64_URL}"
                sha256 "${LINUX_ARM64_SHA}"
              else
                url "${LINUX_X86_URL}"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install "arbor"
            end

            def caveats
              <<~EOS
                To set up shell integration (completions + cd wrapper), run:
                  arbor init
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/arbor --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/arbor.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/arbor.rb
          git commit -m "Update arbor to ${GITHUB_REF_NAME#v}"
          git push

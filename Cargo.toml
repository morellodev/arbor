[package]
name = "arbor"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "A friendly CLI for managing git worktrees"
repository = "https://github.com/morellodev/arbor"
authors = ["Dennis Morello"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
colored = "3.1.1"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
